[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false
venvPath = "."
venv = "venv"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = [
  "E501",  # line length — чередуется с black, не контролируется линтером
  # Наименования переменных/функций в физическом стиле (Q_in, Cv, Cs, S_0_km3).
  # Это НЕ sloppy naming: символы зеркалируют обозначения из СП, и переименовать
  # массово — вредно для читаемости расчётов. Сигнал по классам (N801) сохраняется.
  "N802",
  "N803",
  "N806",
  "N816",
  # E741 — переменная I (уклон) стандартная в гидрологии, не переименовываем.
  "E741",
]

[tool.isort]
profile = "black"
line_length = 100

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
minversion = "8.0"
